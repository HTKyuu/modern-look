name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motion-template/package-lock.json

      - name: Build motion template
        working-directory: motion-template
        run: |
          npm ci
          npm run build

      # Root template is zero-build: publish it as-is, with the built
      # motion template under /motion-template/.
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude _site --exclude '.git*' --exclude .claude \
            --exclude motion-template --exclude docs --exclude scripts \
            --exclude README.md
          cp -r motion-template/dist _site/motion-template
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
